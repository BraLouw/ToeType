<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Typing Test</title>
    <style>
        body {
            background-color: #323437;
            color: #d1d0c5;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 800px;
            text-align: center;
            width: 90%;
        }
        #words-display {
            font-size: 24px;
            color: #646669;
            line-height: 1.6;
            margin-bottom: 30px;
            letter-spacing: 1px;
            text-align: left;
            min-height: 80px;
        }
        .current-word {
            color: #d1d0c5;
            border-bottom: 2px solid #e2b714;
        }
        #input-box {
            background: transparent;
            border: 2px solid #646669;
            color: #d1d0c5;
            font-size: 18px;
            padding: 10px;
            border-radius: 5px;
            outline: none;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        #input-box:focus {
            border-color: #e2b714;
        }
        #stats {
            margin-top: 10px;
            font-size: 18px;
            color: #e2b714;
        }
        .custom-section {
            margin-top: 40px;
            border-top: 1px solid #2c2e31;
            padding-top: 20px;
        }
        #custom-text-input {
            background: #2c2e31;
            border: 1px solid #646669;
            color: #d1d0c5;
            padding: 10px;
            width: 100%;
            max-width: 500px;
            border-radius: 5px;
            outline: none;
            font-family: inherit;
        }
        #apply-btn {
            background: #e2b714;
            color: #323437;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        #apply-btn:hover {
            background: #ffd014;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="words-display"></div>
    <input type="text" id="input-box" placeholder="Type the words here..." autofocus autocomplete="off">
    <div id="stats">WPM: 0 | Accuracy: 100%</div>

    <div class="custom-section">
        <p style="color: #646669; font-size: 14px;">Set Custom Typing Words (separate words with spaces):</p>
        <input type="text" id="custom-text-input" placeholder="Type your custom words here...">
        <br>
        <button id="apply-btn" onclick="setCustomWords()">Apply Custom Words</button>
    </div>
</div>

<script>
    let defaultWordList = ["the", "quick", "brown", "fox", "jumps", "over", "the", "lazy", "dog", "javascript", "code", "github", "game", "typing", "speed", "test", "minimal", "monkey", "style", "lines"];
    let activeWordList = [...defaultWordList];
    let testWords = [];
    let currentWordIndex = 0;
    let startTime = null;
    let totalTypedCharacters = 0;
    let correctCharacters = 0;

    const wordsDisplay = document.getElementById('words-display');
    const inputBox = document.getElementById('input-box');
    const statsDisplay = document.getElementById('stats');
    const customTextInput = document.getElementById('custom-text-input');

    function generateWords() {
        testWords = [];
        // If the user loaded fewer than 15 custom words, just use all of them
        const count = activeWordList.length < 15 ? activeWordList.length : 15;
        
        for (let i = 0; i < count; i++) {
            const randomWord = activeWordList[Math.floor(Math.random() * activeWordList.length)];
            testWords.push(randomWord);
        }
        renderWords();
    }

    function renderWords() {
        wordsDisplay.innerHTML = testWords.map((word, idx) => {
            if (idx === currentWordIndex) {
                return `<span class="current-word">${word}</span>`;
            }
            return `<span>${word}</span>`;
        }).join(' ');
    }

    function setCustomWords() {
        const text = customTextInput.value.trim();
        if (text.length > 0) {
            // Split text by spaces to create a custom word array
            activeWordList = text.split(/\s+/);
            resetTest();
        } else {
            // If empty, revert back to default words
            activeWordList = [...defaultWordList];
            resetTest();
        }
    }

    inputBox.addEventListener('input', (e) => {
        if (!startTime) {
            startTime = new Date();
        }

        const currentWord = testWords[currentWordIndex];
        const typedValue = inputBox.value;

        if (typedValue.endsWith(' ')) {
            const trimmedValue = typedValue.trim();
            totalTypedCharacters += trimmedValue.length + 1;
            
            if (trimmedValue === currentWord) {
                correctCharacters += currentWord.length + 1;
            }

            currentWordIndex++;
            inputBox.value = '';

            if (currentWordIndex >= testWords.length) {
                calculateFinalStats();
                resetTest();
            } else {
                renderWords();
                calculateLiveStats();
            }
        }
    });

    function calculateLiveStats() {
        if (!startTime) return;
        const timeElapsed = (new Date() - startTime) / 1000 / 60;
        const wpm = Math.round((totalTypedCharacters / 5) / timeElapsed) || 0;
        const accuracy = totalTypedCharacters > 0 ? Math.round((correctCharacters / totalTypedCharacters) * 100) : 100;
        statsDisplay.innerText = `WPM: ${wpm} | Accuracy: ${accuracy}%`;
    }

    function calculateFinalStats() {
        const timeElapsed = (new Date() - startTime) / 1000 / 60;
        const wpm = Math.round((totalTypedCharacters / 5) / timeElapsed) || 0;
        alert(`Test complete! Final Speed: ${wpm} WPM`);
    }

    function resetTest() {
        currentWordIndex = 0;
        startTime = null;
        totalTypedCharacters = 0;
        correctCharacters = 0;
        inputBox.value = '';
        generateWords();
        statsDisplay.innerText = `WPM: 0 | Accuracy: 100%`;
        inputBox.focus();
    }

    // Initialize game
    generateWords();
</script>

</body>
</html>
