<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Typing Test</title>
    <style>
        body {
            background-color: #323437;
            color: #d1d0c5;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 800px;
            text-align: center;
            width: 90%;
        }
        .time-modes {
            margin-bottom: 20px;
        }
        .mode-btn {
            background: transparent;
            border: none;
            color: #646669;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            margin: 0 10px;
            padding: 5px 10px;
            transition: color 0.2s;
        }
        .mode-btn:hover {
            color: #d1d0c5;
        }
        .mode-btn.active {
            color: #e2b714;
            font-weight: bold;
        }
        #timer-display {
            font-size: 32px;
            color: #e2b714;
            margin-bottom: 10px;
            font-weight: bold;
        }
        #words-display {
            font-size: 24px;
            color: #646669;
            line-height: 1.6;
            margin-bottom: 30px;
            letter-spacing: 1px;
            text-align: left;
            min-height: 80px;
        }
        .current-word {
            color: #d1d0c5;
            border-bottom: 2px solid #e2b714;
        }
        #input-box {
            background: transparent;
            border: 2px solid #646669;
            color: #d1d0c5;
            font-size: 18px;
            padding: 10px;
            border-radius: 5px;
            outline: none;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        #input-box:focus {
            border-color: #e2b714;
        }
        #stats {
            margin-top: 10px;
            font-size: 18px;
            color: #e2b714;
        }
        .custom-section {
            margin-top: 40px;
            border-top: 1px solid #2c2e31;
            padding-top: 20px;
        }
        #custom-text-input {
            background: #2c2e31;
            border: 1px solid #646669;
            color: #d1d0c5;
            padding: 10px;
            width: 100%;
            max-width: 500px;
            border-radius: 5px;
            outline: none;
            font-family: inherit;
        }
        #apply-btn {
            background: #e2b714;
            color: #323437;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        #apply-btn:hover {
            background: #ffd014;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="time-modes">
        <button class="mode-btn active" onclick="changeDuration(30, this)">30s</button>
        <button class="mode-btn" onclick="changeDuration(60, this)">60s</button>
        <button class="mode-btn" onclick="changeDuration(90, this)">90s</button>
    </div>

    <div id="timer-display">30</div>
    <div id="words-display"></div>
    <input type="text" id="input-box" placeholder="Type the words here..." autofocus autocomplete="off">
    <div id="stats">WPM: 0 | Accuracy: 100%</div>

    <div class="custom-section">
        <p style="color: #646669; font-size: 14px;">Set Custom Typing Words (separate words with spaces):</p>
        <input type="text" id="custom-text-input" placeholder="Type your custom words here...">
        <br>
        <button id="apply-btn" onclick="setCustomWords()">Apply Custom Words</button>
    </div>
</div>

<script>
    let defaultWordList = ["the", "quick", "brown", "fox", "jumps", "over", "lazy", "dog", "javascript", "code", "github", "game", "typing", "speed", "test", "minimal", "monkey", "style", "lines", "keyboard", "practice", "chromebook", "developer", "screen", "timer", "clock", "button", "custom", "words", "challenge"];
    let activeWordList = [...defaultWordList];
    let testWords = [];
    let currentWordIndex = 0;
    
    let timerDuration = 30;
    let timeLeft = timerDuration;
    let countdownInterval = null;
    let isTestRunning = false;
    
    let totalTypedCharacters = 0;
    let correctCharacters = 0;

    const timerDisplay = document.getElementById('timer-display');
    const wordsDisplay = document.getElementById('words-display');
    const inputBox = document.getElementById('input-box');
    const statsDisplay = document.getElementById('stats');
    const customTextInput = document.getElementById('custom-text-input');

    // Shuffle function to mix the words up without duplication
    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[shuffled[i]]];
        }
        return shuffled;
    }

    function generateWords() {
        // Shuffle the active list so it's completely random every game
        testWords = shuffleArray(activeWordList);
        
        // If the shuffled list is tiny, safely expand it so the runner doesn't run out of text
        while (testWords.length < 100) {
            testWords = testWords.concat(shuffleArray(activeWordList));
        }
        
        renderWords();
    }

    function renderWords() {
        wordsDisplay.innerHTML = testWords.map((word, idx) => {
            if (idx === currentWordIndex) {
                return `<span class="current-word">${word}</span>`;
            }
            return `<span>${word}</span>`;
        }).join(' ');
    }

    function changeDuration(seconds, buttonElement) {
        if (isTestRunning) return; 
        
        timerDuration = seconds;
        
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        buttonElement.classList.add('active');
        
        resetTest();
    }

    function setCustomWords() {
        const text = customTextInput.value.trim();
        if (text.length > 0) {
            activeWordList = text.split(/\s+/);
        } else {
            activeWordList = [...defaultWordList];
        }
        resetTest();
    }

    function startTimer() {
        isTestRunning = true;
        countdownInterval = setInterval(() => {
            timeLeft--;
            timerDisplay.innerText = timeLeft;

            calculateLiveStats();

            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                endTest();
            }
        }, 1000);
    }

    inputBox.addEventListener('input', (e) => {
        if (!isTestRunning && inputBox.value.length > 0) {
            startTimer();
        }

        const currentWord = testWords[currentWordIndex];
        const typedValue = inputBox.value;

        if (typedValue.endsWith(' ')) {
            const trimmedValue = typedValue.trim();
            totalTypedCharacters += trimmedValue.length + 1;
            
            if (trimmedValue === currentWord) {
                correctCharacters += currentWord.length + 1;
            }

            currentWordIndex++;
            inputBox.value = '';
            renderWords();
            calculateLiveStats();
        }
    });

    function calculateLiveStats() {
        const timeElapsed = (timerDuration - timeLeft) / 60;
        if (timeElapsed <= 0) return;

        const wpm = Math.round((totalTypedCharacters / 5) / timeElapsed) || 0;
        const accuracy = totalTypedCharacters > 0 ? Math.round((correctCharacters / totalTypedCharacters) * 100) : 100;
        statsDisplay.innerText = `WPM: ${wpm} | Accuracy: ${accuracy}%`;
    }

    function endTest() {
        inputBox.disabled = true;
        const timeElapsed = timerDuration / 60;
        const wpm = Math.round((totalTypedCharacters / 5) / timeElapsed) || 0;
        const accuracy = totalTypedCharacters > 0 ? Math.round((correctCharacters / totalTypedCharacters) * 100) : 100;
        
        alert(`Time's up!\nSpeed: ${wpm} WPM\nAccuracy: ${accuracy}%`);
        resetTest();
    }

    function resetTest() {
        clearInterval(countdownInterval);
        isTestRunning = false;
        timeLeft = timerDuration;
        currentWordIndex = 0;
        totalTypedCharacters = 0;
        correctCharacters = 0;
        
        timerDisplay.innerText = timeLeft;
        inputBox.value = '';
        inputBox.disabled = false;
        generateWords();
        statsDisplay.innerText = `WPM: 0 | Accuracy: 100%`;
        inputBox.focus();
    }

    // Initialize game
    generateWords();
</script>

</body>
</html>
